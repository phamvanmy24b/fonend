<!DOCTYPE html>

<head>

  <header class="site-header">
    <a class="logo" href="index.html">EduHub Web</a>

  <div class="layout">
    <aside class="sidebar">
      <nav aria-label="Menu bên trái">

          <li><a href="index.html">Sự kiện</a></li>

    <main>
      <h1>Sự kiện sắp diễn ra</h1>

      <form id="search-form">

      <div id="event-list">

            <h2><a href="event-detail.html?id=22222222-2222-2222-2222-000000000001">Workshop Git &amp; GitHub cho tân sinh viên</a></h2>
            <p><time datetime="2026-09-12T08:00:00+07:00">08:00, 12/09/2026</time></p>
            <p>Phòng máy A3.201</p>
            <p class="seats">Còn 12/40 chỗ</p>
          </div>
        </article>

        <article class="card">
          <img src="img/event.svg" alt="Hình minh hoạ sự kiện Hackathon EduHub 24 giờ">
          <div class="card-body">
            <h2><a href="event-detail.html?id=22222222-2222-2222-2222-000000000002">Hackathon EduHub 24 giờ</a></h2>
            <p><time datetime="2026-12-19T08:00:00+07:00">08:00, 19/12/2026</time></p>
            <p>Phòng máy A3.205</p>
            <p class="seats"><span class="badge">Hết chỗ</span></p>
          </div>
        </article>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 EduHub Web</p>
